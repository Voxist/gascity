name: fork-verify

# Minimal fork-only CI for bourgois/gascity. Verifies WIP feature branches
# (e.g. cross-store work delivery, vp-kvp) WITHOUT upstream's Blacksmith
# self-hosted runners, runner-policy gating, or secrets — none of which a fork
# has. ubuntu-latest compiles the Dolt go-icu-regex CGO dependency cleanly; the
# `unicode/regex.h` build failure is macOS-only (icu4c@78 header layout), so a
# Linux runner is exactly what's needed to get a real green/red signal.
#
# Reuses the upstream composite action .github/actions/setup-gascity-ubuntu so
# the Go + Dolt + native-dependency setup is not re-solved here.

on:
  pull_request:
    branches: [main, "hotfix/**", "release/**"]
  push:
    branches: [main, "feat/**", "fix/**"]
  workflow_dispatch:

concurrency:
  group: fork-verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOLT_VERSION: "2.6.0"
  BD_VERSION: "v1.95.0" # version string; source commit in BD_SOURCE_REF (lockstep with go.mod beads pin; deps.env, vp-kpoi)
  BD_REPO: "Voxist/beads"
  BD_SOURCE_REF: "4ff2418f74b0d9d5e7cca19dfae40cca786d73bd" # fork-tip bd commit (schema 0072) — built from BD_REPO source by install-bd-archive.sh

jobs:
  verify:
    # Canonical PR branches already run the complete Blacksmith CI graph.
    # This lightweight fallback exists only for forks that cannot use those
    # runners or repository secrets.
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-gascity-ubuntu
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ${{ env.BD_VERSION }}
          install-claude-cli: "false"
      - name: Build (compiles the whole tree — catches compile errors the macOS ICU break hides)
        run: go build ./...
      - name: Vet changed package
        run: go vet ./cmd/gc/...
      - name: Unit tests — cross-store work delivery (vp-kvp stages i/ii/iii)
        run: go test ./cmd/gc/ -run 'TestFilterAssignedWorkBeads|TestAssignedWork|TestFirstStoreWithWork|TestCrossStoreClaimDir|TestRunBDForBead|TestGateOpenWorkBounded|TestCrossStorePipeline' -count=1 -v
      - name: Unit tests — cross-store reachability predicate + fail-loud guard (vp-kvp stage i)
        run: |
          go test ./internal/agentutil/ -run 'TestAgentReachesWorkflowStore|TestAgentIsCrossStoreEligible' -count=1 -v
          go test ./internal/sling/ -run 'TestValidateBuiltInRouteStoreReachableAllowsCityScopedTarget|TestDoSlingRefusesCrossStore' -count=1 -v
      - name: Unit tests — order scope (#2830)
        run: go test ./internal/orders/ -run 'TestParseScope|TestValidateRejectsUnknownScope|TestValidateAcceptsCityAndRigScope|TestParseEnv' -count=1 -v
      - name: Unit tests — scale from zero (#2819)
        run: go test ./cmd/gc/ -run 'TestBuildDesiredState_ScaleFromZero' -count=1 -v

  # The fork's gating unit lane. Upstream's suites run under Bazel on
  # rbe-west (bazel.yml), which a fork cannot reach, so these are the
  # Go-native twins on GitHub-hosted runners, in the shard shapes the fork's
  # pre-Bazel ci.yml already ran on ubuntu-latest.
  static:
    # Named for the fork ruleset's required check: upstream's ci.yml no
    # longer has a preflight job, and this static lane is the fork's preflight.
    name: CI / preflight
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-gascity-ubuntu
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ${{ env.BD_VERSION }}
          install-claude-cli: "false"
      - name: Build-cache ban guard
        run: make check-go-clean-cache
      - name: CI policy
        run: make test-ci-policy
      - name: Format
        run: make fmt-check
      - name: Vet (go vet plus the build-tag scopes)
        run: make vet-go

  unit-noncmdgc:
    name: unit (non-cmd/gc ${{ matrix.shard }} of 3)
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-gascity-ubuntu
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ${{ env.BD_VERSION }}
          install-claude-cli: "false"
      - name: Unit tests (non-cmd/gc shard ${{ matrix.shard }} of 3)
        run: make test-cover-noncmdgc-shard NONCMDGC_COVER_SHARD=${{ matrix.shard }} NONCMDGC_COVER_TOTAL=3

  unit-cmdgc:
    name: unit (cmd/gc ${{ matrix.shard }} of 8)
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 8, not 6: each shard passes its tests to go test as one -run regex,
        # and Linux caps a single argv string at 128 KiB (MAX_ARG_STRLEN). At
        # 6 shards the 2026-10-27 resync pushed a shard to ~132 KB, so exec
        # failed with E2BIG and go test exited 2 before running anything.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-gascity-ubuntu
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ${{ env.BD_VERSION }}
          install-claude-cli: "false"
      - name: Unit tests (cmd/gc shard ${{ matrix.shard }} of 8)
        run: make test-cover-cmdgc-shard CMD_GC_COVER_SHARD=${{ matrix.shard }} CMD_GC_COVER_TOTAL=8
