name: voxist-secret-scan

# Fleet standard betterleaks secret-scan for the gascity fork (bead vp-ty88y,
# operator decision 2026-09-27, bd memory secret-scan-tool-is-betterleaks).
#
# Named voxist-secret-scan.yml, not secret-scan.yml, and paired with
# .voxist-betterleaks.toml / .github/ci/voxist-secret-scan-range.sh, so a
# gastownhall/gascity upstream resync never touches or conflicts with this
# fork-only workflow (this fork resyncs from upstream; see docs/... in the
# PR for the resync mechanics). Do not rename any of the three files without
# checking the resync path first.
#
# The job id is `secret-scan` — no `name:` override — because a required
# status-check context equals the job name, which defaults to the job id.
# Make this a required check on Voxist/gascity main once it is green
# (bead vp-ty88y).
#
# Reference job: voxist-platform .github/workflows/pack-ci.yml secret-scan
# (BETTERLEAKS_VERSION pinned, release tarball checksum-verified, CLI run
# directly — no Action wrapper: gitleaks-action needs a paid org licence,
# and the only betterleaks action is an unvetted single-maintainer repo).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: voxist-secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    # No `name:` — status-check context must equal the job id `secret-scan`.
    runs-on: ubuntu-24.04
    env:
      BETTERLEAKS_VERSION: "1.3.1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Kept at 0 deliberately: the merge-base computation in
          # .github/ci/voxist-secret-scan-range.sh needs the full ancestry.
          # The fix for over-broad scanning is the range, not the depth.
          fetch-depth: 0
      - name: Install betterleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          BASE="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          ASSET="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "${BASE}/${ASSET}" -o "${ASSET}"
          curl -fsSL "${BASE}/checksums.txt" -o checksums.txt
          grep -F "${ASSET}" checksums.txt | sha256sum -c -
          tar -xzf "${ASSET}"
          sudo install -m 755 betterleaks /usr/local/bin/betterleaks
          betterleaks version
      # Scoped to THIS event's own commits, not the whole repository. An
      # unscoped `betterleaks git .` scans `git log -p --all`, so a required
      # check would fail a PR for findings on unrelated branches (measured on
      # voxist-platform PR #766, bead vc-rq8b). Scoping changes only which
      # event a finding lands on, never whether it is found: every commit is
      # in exactly one PR range and one push range.
      - name: Scan this event's own commits for secrets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="$(bash .github/ci/voxist-secret-scan-range.sh)"
          echo "scanning range: ${range}"
          betterleaks git . --config .voxist-betterleaks.toml --log-opts="${range}"
