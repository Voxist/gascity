# Voxist betterleaks configuration for the gascity fork (vp-ty88y).
#
# Named .voxist-betterleaks.toml, not .betterleaks.toml, so a future upstream
# gastownhall/gascity commit that adds its own betterleaks/gitleaks config at
# the default path never collides with this fork-only file on resync (the
# same "files upstream never touches" rule as
# .github/workflows/voxist-secret-scan.yml and
# .github/ci/voxist-secret-scan-range.sh in this same PR). Passed explicitly
# via `betterleaks git . --config .voxist-betterleaks.toml`.
#
# Copied from voxist-platform .github/workflows/pack-ci.yml's secret-scan job
# / livetranslate-webrtc .betterleaks.toml (fleet standard, bd memory
# secret-scan-tool-is-betterleaks). BETTERLEAKS_VERSION pinned to v1.3.1
# alongside this config in the workflow.

# Global prefilter — skip binary/vendor/node_modules paths before regex.
# Reduces scan time and eliminates noisy false positives.
#
# go.sum is added here after the full-history triage for vp-ty88y: every one
# of its 23 unique findings is a base64-encoded Go module checksum (44 chars,
# entropy ~4.7-5.1), the same well-known FP class the shared voxist-platform
# config calls out for its own reasons — go.sum is regenerated content, never
# hand-authored, and cannot carry a committed credential.
#
# The three cmd/gc / internal/worker / internal/processenv test files are
# added for the same reason: dedicated test-fixture files (resume-token and
# secrets.env-parsing test data) whose sole non-UUID findings are synthetic
# fixture values reused verbatim across their own test cases, never referenced
# from non-test code. Scoped to these three files, not all of `*_test.go`, so
# a real secret pasted into some other test file is still caught.
#
# .beads/(metadata.json|config.yaml|interactions.jsonl) is restored from the
# shared voxist-platform .betterleaks.toml: this fork's history carries
# .beads/config.yaml and .beads/metadata.json from before the .beads/backup/
# restructure (no live findings from either today, but a full-history scan
# still walks their old blobs, and future bead metadata can reintroduce this
# FP class), so keep the same exclusion the platform config applies fleet-wide.
prefilter = '''
matchesAny(attributes[?"path"].orValue(""), [
  r"""(?i)\.(?:bmp|gif|jpe?g|png|svg|tiff|pdf|exe|dll|so|dylib|woff2?|ttf|eot|ico|mp3|mp4|wav|ogg|webm|zip|tar\.gz|tgz)$""",
  r"""(?:^|/)node_modules(?:/.*)?$""",
  r"""(?:^|/)vendor(?:/.*)?$""",
  r"""(?:^|/)\.git(?:/.*)?$""",
  r"""(?:^|/)__pycache__(?:/.*)?$""",
  r"""(?:^|/)go\.sum$""",
  r"""(?:^|/)cmd/gc/session_reconciler_drift_resume_test\.go$""",
  r"""(?:^|/)internal/worker/provider_resume_test\.go$""",
  r"""(?:^|/)internal/processenv/envfile_test\.go$""",
  r"""(?:^|/)\.beads/(?:metadata\.json|config\.yaml|interactions\.jsonl)$"""
])
'''

# Global post-match filter — remove known placeholder patterns, the
# production signed-pause public key, and UUID-shaped test-fixture ids in
# the specific files that carry them.
filter = '''
containsAny(finding["secret"], [
  "EXAMPLE",
  "CHANGEME",
  "YOUR_API_KEY_HERE",
  "INSERT_",
  "FIXME",
  "TODO",
  "0000000000000000",
  "XXXXXXXXXXXXXXXX",
  "xxxxxxxxxxxxxxxx",
  "sk-placeholder",
  "test-key-do-not-use",
  "fake-secret"
])
|| finding["secret"].size() < 8

// internal/productmetrics/pause.go's productionPauseKeyBase64 is the ed25519
// PUBLIC verification key for the signed-pause (kill-switch) envelope,
// compiled into production artifacts (upstream commit 3928f31e, "seat the
// approved signed-pause kill-switch key"). The matching PRIVATE seed lives in
// OpenBao and is never in this repo; the public key authorises nothing on its
// own — it only lets the transport verify a pause someone else signed. Listed
// as the exact literal, scoped to its one file, so nothing else is suppressed
// with it (same model as the voxist-platform config's Claude Code OAuth
// client id, bead vc-zacb).
|| (
  finding["secret"] == "zNKeoRoMhfYJ0ZB82trzvK+7ZgIcRSbyBBp2NtX49vY"
  && attributes[?"path"].orValue("") == "internal/productmetrics/pause.go"
)

// UUID-shaped (dashed or undashed) test-fixture ids — bead/session ids reused
// verbatim as record identifiers in these specific test and corpus files, not
// secrets on their own (a UUID identifies a record; it authorises nothing).
// Scoped to exactly the paths the vp-ty88y full-history triage found them in,
// not a blanket "any UUID anywhere" rule: gascity's production code paths
// (e.g. provider credential handling) are NOT covered by this clause, so a
// UUID-shaped credential committed outside these files — Voxist API keys ARE
// UUID-shaped, per the livetranslate incident — still trips generic-api-key.
|| (
  matchesAny(finding["secret"], [
    r"""^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$""",
    r"""^[0-9a-fA-F]{32}$"""
  ])
  && matchesAny(attributes[?"path"].orValue(""), [
    r"""(?:^|/)cmd/gc/usage_compute_test\.go$""",
    r"""(?:^|/)cmd/gc/adoption_barrier_test\.go$""",
    r"""(?:^|/)cmd/gc/session_wake_fence_test\.go$""",
    r"""(?:^|/)cmd/gc/cmd_session_logs_test\.go$""",
    r"""(?:^|/)cmd/gc/productmetrics_private_process_test\.go$""",
    r"""(?:^|/)cmd/gc/productmetrics_private_process_testhook_test\.go$""",
    r"""(?:^|/)cmd/gc/session_beads_test\.go$""",
    r"""(?:^|/)cmd/gc/testdata/wd15_drain_ack_twin_corpus\.jsonl$""",
    r"""(?:^|/)cmd/gc/testdata/wd15_campaign_corpus\.jsonl$""",
    r"""(?:^|/)internal/session/transcript_lookup_test\.go$""",
    r"""(?:^|/)internal/session/manager_test\.go$""",
    r"""(?:^|/)internal/worker/history_identity_test\.go$""",
    r"""(?:^|/)internal/worker/transcript/claude_slug_test\.go$""",
    r"""(?:^|/)internal/worker/invocation_telemetry_usagefact_test\.go$""",
    r"""(?:^|/)internal/worker/message_receipt_test\.go$""",
    r"""(?:^|/)internal/api/handler_sessions_test\.go$""",
    r"""(?:^|/)internal/api/session_structured_identity_test\.go$""",
    // Root-level historical bead export, pre-.beads/backup restructure; no
    // longer tracked at HEAD, but still present in full git history.
    r"""^issues\.jsonl$"""
  ])
)
'''

# Restore the built-in ruleset. `--config` REPLACES the default config
# rather than extending it — a config carrying only prefilter/filter would
# scan with an EMPTY ruleset: it reads every byte, matches nothing, and
# reports green even with a real secret committed (bead vp-gwww5,
# docs/betterleaks-setup.md in voxist-platform).
[extend]
useDefault = true
